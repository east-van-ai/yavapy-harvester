[project]
name = "yavapy-harvester"
version = "0.1.0"
description = "Records which published Python CLIs carry an Agent Skill"
readme = "README.md"
authors = [
    { name = "Go Nakamaru" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
yavapy-harvester = "yavapy_harvester.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
